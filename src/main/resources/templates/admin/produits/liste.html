<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produits — Admin ShopElite</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" th:href="@{/admin}">Shop<span>Elite</span> Admin</a>
  <div class="navbar-nav">
    <a th:href="@{/admin}" class="nav-link">Dashboard</a>
    <a th:href="@{/admin/produits}" class="nav-link active">Produits</a>
    <a th:href="@{/admin/categories}" class="nav-link">Catégories</a>
    <a th:href="@{/admin/commandes}" class="nav-link">Commandes</a>
    <a th:href="@{/catalogue}" class="nav-link">Voir la boutique</a>
    <form th:action="@{/logout}" method="post" style="display:inline">
      <button type="submit" class="btn btn-secondary btn-sm">Déconnexion</button>
    </form>
  </div>
</nav>

<div class="container">
  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

  <div class="page-header">
    <h1 class="page-title">Gestion des <span>Produits</span></h1>
    <a th:href="@{/admin/produits/nouveau}" class="btn btn-primary">+ Nouveau produit</a>
  </div>

  <!-- Tableau -->
  <div class="card">
    <div th:if="${produits.empty}" class="empty-state">
      <div class="icon">📦</div>
      <h3>Aucun produit</h3>
      <a th:href="@{/admin/produits/nouveau}" class="btn btn-primary">Créer le premier produit</a>
    </div>

    <table th:unless="${produits.empty}" class="table">
      <thead>
        <tr>
          <th>Image</th>
          <th>Nom</th>
          <th>Prix</th>
          <th>Stock</th>
          <th>Catégorie</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="p : ${produits}">

          <!-- Miniature image -->
          <td>
            <img th:if="${p.imageUrl != null and !p.imageUrl.isEmpty()}"
                 th:src="${p.imageUrl}" th:alt="${p.nom}"
                 style="width:50px;height:50px;object-fit:cover;border-radius:6px;border:1px solid var(--border,#ddd);"/>
            <span th:unless="${p.imageUrl != null and !p.imageUrl.isEmpty()}"
                  style="font-size:1.75rem;"
                  th:text="${p.categorie != null and p.categorie.nom == 'Electronique' ? '💻' :
                             (p.categorie != null and p.categorie.nom == 'Vetements' ? '👕' :
                             (p.categorie != null and p.categorie.nom == 'Livres' ? '📚' :
                             (p.categorie != null and p.categorie.nom == 'Sport' ? '⚽' : '🏠')))}">📦</span>
          </td>

          <!-- Nom + description -->
          <td>
            <div style="font-weight:600;" th:text="${p.nom}">Nom</div>
            <div style="font-size:.8rem;color:var(--text-muted,#888);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;"
                 th:text="${p.description}">Desc</div>
          </td>

          <!-- Prix -->
          <td>
            <strong th:text="${#numbers.formatDecimal(p.prix,1,'COMMA',2,'POINT')} + ' €'">0€</strong>
          </td>

          <!-- Stock -->
          <td>
            <span th:class="${p.stock > 5} ? 'stock-badge stock-ok' : 'stock-badge stock-low'"
                  th:text="${p.stock} + ' unités'">0</span>
          </td>

          <!-- Catégorie -->
          <td th:text="${p.categorie != null ? p.categorie.nom : '—'}">—</td>

          <!-- Statut -->
          <td>
            <span th:if="${p.actif}"   class="stock-badge stock-ok">Actif</span>
            <span th:unless="${p.actif}" class="stock-badge stock-low">Inactif</span>
          </td>

          <!-- Actions -->
          <td>
            <a th:href="@{/admin/produits/modifier/{id}(id=${p.id})}"
               class="btn btn-secondary btn-sm">✏️ Modifier</a>

            <form th:action="@{/admin/produits/supprimer/{id}(id=${p.id})}"
                  method="post" style="display:inline;"
                  onsubmit="return confirm('Désactiver ce produit ?')">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-danger btn-sm">🗑 Supprimer</button>
            </form>
          </td>

        </tr>
      </tbody>
    </table>
  </div>
</div>

<footer><span>ShopElite</span> — Projet AQL 2025/2026 · Pr. S. CHANTIT</footer>
</body>
</html>
