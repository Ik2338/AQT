<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produit — Admin ShopElite</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
  <a class="navbar-brand" th:href="@{/admin}">Shop<span>Elite</span> Admin</a>
  <div class="navbar-nav">
    <a th:href="@{/admin}" class="nav-link">Dashboard</a>
    <a th:href="@{/admin/produits}" class="nav-link active">Produits</a>
    <a th:href="@{/admin/categories}" class="nav-link">Catégories</a>
    <a th:href="@{/admin/commandes}" class="nav-link">Commandes</a>
    <form th:action="@{/logout}" method="post" style="display:inline">
      <button type="submit" class="btn btn-secondary btn-sm">Déconnexion</button>
    </form>
  </div>
</nav>

<div class="container">
  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}"   class="alert alert-error"   th:text="${error}"></div>

  <div class="page-header">
    <h1 class="page-title"
        th:text="${produit.id != null ? 'Modifier le produit' : 'Nouveau '}">
      <span>Produit</span>
    </h1>
    <a th:href="@{/admin/produits}" class="btn btn-secondary btn-sm">← Retour à la liste</a>
  </div>

  <div class="card" style="max-width:700px;margin:0 auto;">
    <form th:action="${produit.id != null ? '/admin/produits/modifier/' + produit.id : '/admin/produits/nouveau'}"
          method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <!-- Nom -->
      <div class="form-group">
        <label class="form-label">Nom du produit *</label>
        <input type="text" name="nom" class="form-control"
               th:value="${produit.nom}" placeholder="Ex: Smartphone Samsung Galaxy" required/>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" rows="3"
                  placeholder="Décrivez le produit..."
                  th:text="${produit.description}"></textarea>
      </div>

      <!-- Prix + Stock -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
        <div class="form-group">
          <label class="form-label">Prix (€) *</label>
          <input type="number" name="prix" class="form-control"
                 th:value="${produit.prix}" min="0.01" step="0.01"
                 placeholder="0.00" required/>
        </div>
        <div class="form-group">
          <label class="form-label">Stock *</label>
          <input type="number" name="stock" class="form-control"
                 th:value="${produit.stock}" min="0"
                 placeholder="0" required/>
        </div>
      </div>

      <!-- Catégorie -->
      <div class="form-group">
        <label class="form-label">Catégorie</label>
        <select name="categorieId" class="form-control">
          <option value="">— Aucune catégorie —</option>
          <option th:each="cat : ${categories}"
                  th:value="${cat.id}"
                  th:text="${cat.nom}"
                  th:selected="${produit.categorie != null and produit.categorie.id == cat.id}">
          </option>
        </select>
      </div>

      <!-- URL Image -->
      <div class="form-group">
        <label class="form-label">URL de l'image</label>
        <input type="url" name="imageUrl" id="imageUrl" class="form-control"
               th:value="${produit.imageUrl}"
               placeholder="https://exemple.com/image.jpg"
               oninput="previewImage(this.value)"/>
        <small style="color:var(--text-muted,#888)">
          Colle l'URL d'une image web (jpg, png, webp)
        </small>
      </div>

      <!-- Aperçu image -->
      <div class="form-group" id="previewZone"
           th:style="${produit.imageUrl != null and !produit.imageUrl.isEmpty()} ? '' : 'display:none'">
        <label class="form-label">Aperçu</label>
        <div style="border:1px solid var(--border,#ddd);border-radius:8px;padding:.5rem;display:inline-block;">
          <img id="previewImg"
               th:src="${produit.imageUrl}"
               th:alt="${produit.nom}"
               style="max-width:200px;max-height:200px;object-fit:contain;border-radius:6px;display:block;"/>
        </div>
      </div>

      <!-- Boutons -->
      <div style="display:flex;gap:1rem;margin-top:1.5rem;">
        <button type="submit" class="btn btn-primary"
                th:text="${produit.id != null ? '💾 Enregistrer' : '✨ Créer le produit'}">
          Enregistrer
        </button>
        <a th:href="@{/admin/produits}" class="btn btn-secondary">Annuler</a>
      </div>

    </form>
  </div>
</div>

<footer><span>ShopElite</span> — Projet AQL 2025/2026 · Pr. S. CHANTIT</footer>

<script>
function previewImage(url) {
  const zone = document.getElementById('previewZone');
  const img  = document.getElementById('previewImg');
  if (!url) { zone.style.display = 'none'; return; }
  img.src = url;
  zone.style.display = '';
  img.onerror = () => { zone.style.display = 'none'; };
  img.onload  = () => { zone.style.display = ''; };
}
</script>
</body>
</html>
