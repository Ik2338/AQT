# Base de données H2 pour les tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA - Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# H2 Console
spring.h2.console.enabled=false

# Désactiver l'initialisation automatique des données de production
spring.sql.init.mode=never

# Désactiver le cache Thymeleaf pour les tests
spring.thymeleaf.cache=false

# Mots de passe fixes pour les tests (aligne avec DataInitializer)
app.init.admin-password=admin123
app.init.client-password=client123

# Logging réduit pour les tests
logging.level.org.springframework.security=WARN
logging.level.com.ecommerce=INFO
logging.level.org.hibernate.SQL=WARN

spring.security.user.name=admin
spring.security.user.password=admin