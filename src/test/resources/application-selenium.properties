# ============================================================
# application-selenium.properties
# Profil "selenium" — utilisé par EcommerceSystemTest
# ============================================================

# ── Base de données H2 en mémoire ───────────────────────────
spring.datasource.url=jdbc:h2:mem:seleniumdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# ── H2 Console ──────────────────────────────────────────────
spring.h2.console.enabled=false

# ── Initialisation SQL de production désactivée ─────────────
spring.sql.init.mode=never

# ── Thymeleaf ───────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── Mots de passe pour DataInitializer ──────────────────────
# CRITIQUE : DataInitializer lit ces propriétés et encode les mots de passe
# avec BCryptPasswordEncoder avant de les stocker en base H2.
# Les tests Selenium utilisent ces mêmes mots de passe en clair via loginAs().
# Si ces propriétés sont absentes → encode(null) → hash invalide → login échoue.
app.init.admin-password=admin123
app.init.client-password=client123

# ── CORRECTION CRITIQUE pour les tests Selenium ─────────────
# Exclure UserDetailsServiceAutoConfiguration via la propriété Spring Boot.
# POURQUOI ici plutôt que dans @SpringBootTest(excludeAutoConfiguration=...) :
#   - excludeAutoConfiguration n'existe pas sur @SpringBootTest → erreur compile
#   - @EnableAutoConfiguration(exclude=...) désactive TOUTES les auto-configs
#     non listées → casse datasource/JPA → DataInitializer ne tourne pas
#     → base H2 vide → login échoue
# CETTE propriété exclut UNIQUEMENT l'auto-config du user aléatoire, sans
# toucher à datasource, JPA, Hibernate, ni DataInitializer.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ── Logging ─────────────────────────────────────────────────
logging.level.org.springframework.security=WARN
logging.level.com.ecommerce=INFO
logging.level.org.hibernate.SQL=WARN